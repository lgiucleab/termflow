[workspace]
resolver = "3"
members = ["crates/*", "apps/cli", "apps/desktop/src-tauri", "tests/mock-provider"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/lgiucleab/termflow"
authors = ["Flow Labs"]
publish = false

[workspace.dependencies]
# internal
termflow-types = { path = "crates/termflow-types" }
termflow-config = { path = "crates/termflow-config" }
termflow-catalog = { path = "crates/termflow-catalog" }
termflow-store = { path = "crates/termflow-store" }
termflow-secrets = { path = "crates/termflow-secrets" }
termflow-core = { path = "crates/termflow-core" }
termflow-pty = { path = "crates/termflow-pty" }
termflow-shell-integ = { path = "crates/termflow-shell-integ" }
termflow-terminal = { path = "crates/termflow-terminal" }
termflow-providers = { path = "crates/termflow-providers" }
termflow-router = { path = "crates/termflow-router" }
termflow-agent = { path = "crates/termflow-agent" }
termflow-tools = { path = "crates/termflow-tools" }
termflow-perms = { path = "crates/termflow-perms" }
termflow-context = { path = "crates/termflow-context" }
mock-provider = { path = "tests/mock-provider" }

# external
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
schemars = "1.2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
rusqlite = { version = "0.41", features = ["bundled"] } # pinned to what rusqlite_migration 2.7 supports
rusqlite_migration = "2.7"
directories = "6"
ulid = { version = "1", features = ["serde"] }
jiff = { version = "1", features = ["serde"] }
regex = "1"
specta = { version = "=2.0.0-rc.28", features = ["derive", "serde_json"] }
tempfile = "3"
vte = "0.15"
base64 = "0.23"
portable-pty = "0.9"
proptest = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream", "json", "http2", "charset", "system-proxy"] }
eventsource-stream = "0.2"
async-trait = "0.1"
futures = "0.3"
keyring = "4.2"
axum = "0.8"
insta = { version = "1", features = ["json"] }
tokio-stream = "0.1"
ignore = "0.4"
grep-searcher = "0.1"
grep-regex = "0.1"
grep-matcher = "0.1"
globset = "0.4"
similar = "3"
htmd = "0.6"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unsafe_code = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
# pedantic lints we deliberately allow:
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
