name: release

# Push a tag like v0.1.0 to build the CLI for every platform and publish a GitHub release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build, e.g. v0.1.0
        required: true

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: ./.github/actions/setup-bun

      - name: Typecheck
        run: bun run typecheck

      # Bun cross-compiles every target from this one Linux runner.
      - name: Build CLI
        working-directory: packages/cli
        run: |
          export OPENCODE_VERSION="${TAG#v}" OPENCODE_CHANNEL=latest
          bun run script/build.ts

      - name: Package binaries
        working-directory: packages/cli/dist
        run: |
          mkdir -p ../release
          for dir in cli-*/; do
            name="termflow-${dir#cli-}"; name="${name%/}"
            if [ -f "$dir/bin/termflow.exe" ]; then
              (cd "$dir/bin" && zip -q "../../../release/$name.zip" termflow.exe)
            else
              tar -czf "../release/$name.tar.gz" -C "$dir/bin" termflow
            fi
          done
          cd ../release && sha256sum * > SHA256SUMS.txt && ls -lh

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=$([[ "$TAG" == *-* ]] && echo --prerelease || true)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" packages/cli/release/* --clobber
          else
            gh release create "$TAG" packages/cli/release/* --title "TermFlow $TAG" --generate-notes $prerelease
          fi
