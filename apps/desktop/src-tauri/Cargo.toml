[package]
name = "termflow-desktop"
description = "TermFlow desktop app (Tauri 2 glue only)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "termflow_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[lints]
workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
termflow-core.workspace = true
termflow-types = { workspace = true, features = ["specta"] }
termflow-secrets.workspace = true
tauri = { version = "2", features = [] }
tauri-specta = { version = "=2.0.0-rc.29", features = ["derive", "typescript"] }
specta.workspace = true
specta-typescript = "=0.0.15"
serde.workspace = true
tokio.workspace = true
tokio-util.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
